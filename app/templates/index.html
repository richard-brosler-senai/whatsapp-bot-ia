<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WhatsApp Bot IA</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <header>
        <div class="container">
            <h1>WhatsApp Bot IA</h1>
            <span>Groq + Twilio</span>
        </div>
    </header>

    <main class="container">

        <section class="card">

            <h2>Status do sistema</h2>

            <div id="status">
                Verificando...
            </div>

        </section>

        <section class="card">

            <h2>Teste do Bot</h2>

            <div id="chat" class="chat">

                <div class="bot-message">
                    Olá! Digite uma mensagem para testar o bot.
                </div>

            </div>

            <div class="input-area">

                <input
                    type="text"
                    id="message"
                    placeholder="Digite sua mensagem..."
                >

                <button id="send">
                    Enviar
                </button>

            </div>

        </section>

    </main>

    <script
        src="{{ url_for('static', filename='js/app.js') }}">
    </script>

</body>
</html>
